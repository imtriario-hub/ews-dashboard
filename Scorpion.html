<html lang="id" class="dark"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dashboard EWS Monitoring Komitmen Cabang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }
        
        .safe-top    { padding-top: env(safe-area-inset-top, 0px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .safe-left   { padding-left: env(safe-area-inset-left, 0px); }
        .safe-right  { padding-right: env(safe-area-inset-right, 0px); }
        
        .glow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(244, 63, 94, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
        }

        .header-window {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, border-color 0.3s ease;
        }
        .header-hidden {
            transform: translateY(-100%);
        }

        .tab-btn {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 44px;
        }
        .tab-btn-active-komitmen {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff !important;
            box-shadow: 0 4px 15px -3px rgba(79, 70, 229, 0.5);
        }
        .tab-btn-active-threshold {
            background: linear-gradient(135deg, #e11d48 0%, #f43f5e 100%);
            color: #ffffff !important;
            box-shadow: 0 4px 15px -3px rgba(225, 29, 72, 0.5);
        }

        .badge-breach, .badge-red {
            background-color: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.4);
        }
        .badge-safe, .badge-green {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .table-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(99,102,241,0.4) transparent;
        }
        .table-scroll-wrapper::-webkit-scrollbar { height: 4px; }
        .table-scroll-wrapper::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.4); border-radius: 2px; }

        @media (max-width: 767px) {
            .mobile-bottom-nav {
                position: fixed;
                bottom: 0; left: 0; right: 0;
                z-index: 60;
                padding-bottom: env(safe-area-inset-bottom, 0px);
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-top: 1px solid rgba(99, 102, 241, 0.25);
            }
            .mobile-bottom-nav-spacer {
                height: calc(72px + env(safe-area-inset-bottom, 0px));
            }
        }
        @media (min-width: 768px) {
            .mobile-bottom-nav { display: none !important; }
            .mobile-bottom-nav-spacer { display: none !important; }
            .desktop-tabs { display: flex !important; }
        }
        @media (max-width: 767px) {
            .desktop-tabs { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300 relative" id="bodyRoot">

    <div class="glow-bg"></div>

    <!-- Header Navigation -->
    <header id="mainHeader" class="header-window bg-slate-900/95 dark:bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 dark:border-slate-800 fixed top-0 left-0 w-full z-50 shadow-xl safe-top">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex items-center justify-between gap-3 mb-2.5">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="bg-gradient-to-tr from-rose-500 via-purple-600 to-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30 text-white flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0V9m0 8l-8-8-4 4-6-6"></path>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base sm:text-lg font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent truncate">
                            Dashboard EWS Monitoring (Multi-Sheet Google Sheets Sync)
                        </h1>
                        <p class="text-[10px] sm:text-xs text-indigo-300 font-medium flex flex-wrap items-center gap-1.5">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping flex-shrink-0"></span>
                            <span class="truncate">Executive Risk Analytics</span>
                            <span class="text-slate-500 font-normal">|</span>
                            <span id="lastUpdateHeader" class="text-slate-400 font-semibold bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/50">Sinkronisasi 3 Sheet Aktif</span>
                        </p>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 flex-shrink-0">
                    <button onclick="toggleTheme()" class="bg-slate-800 hover:bg-slate-700 text-amber-300 p-2.5 rounded-xl shadow transition border border-slate-700 flex items-center justify-center" title="Ganti Mode Gelap/Terang" style="min-width:44px;min-height:44px">
                        <svg id="themeIconSun" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden dark:block text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg id="themeIconMoon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 block dark:hidden text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <button onclick="fetchAllGoogleSheets()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white p-2.5 rounded-xl shadow-lg transition border border-blue-400/30 flex items-center justify-center" title="Refresh Data" style="min-width:44px;min-height:44px">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Desktop Nav Tabs -->
            <div class="desktop-tabs bg-slate-800/90 border border-slate-700/80 p-1.5 rounded-2xl shadow-inner items-center gap-1.5">
                <button id="navTabKomitmen" onclick="switchTab('komitmen')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 text-slate-400 hover:text-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>1. Vs Komitmen (Unit)</span>
                </button>
                <button id="navTabThreshold" onclick="switchTab('threshold')" class="tab-btn px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 text-slate-400 hover:text-slate-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                    <span>2. Vs Threshold (%)</span>
                </button>
                <button id="navTabPembayaran" onclick="switchTab('pembayaran')" class="tab-btn tab-btn-active-komitmen px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    <span>3. Update Pembayaran</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <div class="flex items-stretch gap-2 px-3 py-2">
            <button id="mobileNavTabKomitmen" onclick="switchTab('komitmen')" class="flex-1 flex flex-col items-center justify-center gap-1 rounded-2xl py-2.5 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="text-[10px] font-bold">Vs Komitmen</span>
            </button>
            <button id="mobileNavTabThreshold" onclick="switchTab('threshold')" class="flex-1 flex flex-col items-center justify-center gap-1 rounded-2xl py-2.5 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                <span class="text-[10px] font-bold">Vs Threshold</span>
            </button>
            <button id="mobileNavTabPembayaran" onclick="switchTab('pembayaran')" class="tab-btn tab-btn-active-komitmen flex-1 flex flex-col items-center justify-center gap-1 rounded-2xl py-2.5 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span class="text-[10px] font-bold">Update Bayar</span>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-3 sm:px-4 pt-[80px] sm:pt-[96px] md:pt-32 pb-6 sm:pb-10 space-y-4 sm:space-y-6">
        
        <!-- Status Notification Bar -->
        <div id="statusMessage" class="p-4 rounded-2xl text-sm font-semibold shadow-lg transition border bg-blue-950/80 text-blue-200 border-blue-500/50 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-base">🔄</span>
                <span id="statusText">Menghubungkan ke 3 Sheet Google Sheets...</span>
            </div>
        </div>

        <!-- ==================== MENU 1: VS KOMITMEN (UNIT BASED) ==================== -->
        <div id="viewKomitmen" class="space-y-6 hidden">
            <section class="glass-card rounded-2xl p-6 shadow-xl transition-colors duration-300">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></span>
                        Ringkasan Total Nasional (Semua Cabang) — Mode Unit Komitmen
                    </h2>
                </div>
            </section>
        </div>

        <!-- ==================== MENU 2: VS THRESHOLD (%) ==================== -->
        <div id="viewThreshold" class="space-y-4 sm:space-y-6 hidden">
            <div class="glass-card border border-slate-700/80 rounded-2xl p-4 shadow-xl">
                <h2 class="text-sm sm:text-lg font-bold text-white mb-3">Batas Maksimum Rasio Aktual EWS</h2>
            </div>
        </div>

        <!-- ==================== MENU 3: UPDATE PEMBAYARAN ==================== -->
        <div id="viewPembayaran" class="space-y-6">
            <section class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                        Update Pembayaran Debitur (Lancar/Rasio 0)
                    </h2>
                </div>
            </section>
        </div>

        <!-- Spacer for mobile bottom nav -->
        <div class="mobile-bottom-nav-spacer"></div>
    </main>

    <!-- AUTOMATIC MULTI-SHEET GOOGLE SHEETS SYNC SCRIPT -->
    <script>
        // 3 Tautan CSV Google Sheets Berdasarkan Skenario Anda
        const URL_SHEET_DETAIL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=19393818&single=true&output=csv';
        const URL_SHEET_SUMMARY = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=1399865567&single=true&output=csv';
        const URL_SHEET_AGREEMENT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=1413662010&single=true&output=csv';

        async function fetchAllGoogleSheets() {
            try {
                document.getElementById('statusText').innerText = "Sedang menarik data dari 3 sheet Google Sheets...";
                
                const [resDetail, resSummary, resAgreement] = await Promise.all([
                    fetch(URL_SHEET_DETAIL),
                    fetch(URL_SHEET_SUMMARY),
                    fetch(URL_SHEET_AGREEMENT)
                ]);

                if (!resDetail.ok || !resSummary.ok || !resAgreement.ok) {
                    throw new Error('Gagal mengambil salah satu sheet dari Google Sheets');
                }

                const csvDetail = await resDetail.text();
                const csvSummary = await resSummary.text();
                const csvAgreement = await resAgreement.text();

                // Parsing menggunakan SheetJS
                const wbDetail = XLSX.read(csvDetail, { type: 'string' });
                const wbSummary = XLSX.read(csvSummary, { type: 'string' });
                const wbAgreement = XLSX.read(csvAgreement, { type: 'string' });

                const dataDetail = XLSX.utils.sheet_to_json(wbDetail.Sheets[wbDetail.SheetNames[0]], { header: 1 });
                const dataSummary = XLSX.utils.sheet_to_json(wbSummary.Sheets[wbSummary.SheetNames[0]], { header: 1 });
                const dataAgreement = XLSX.utils.sheet_to_json(wbAgreement.Sheets[wbAgreement.SheetNames[0]], { header: 1 });

                document.getElementById('statusText').innerText = "Berhasil menyinkronkan seluruh data (Detail, Summary, Agreement) dari Google Sheets secara real-time!";
                document.getElementById('statusMessageclassName = "p-4 rounded-2xl text-sm font-semibold shadow-lg transition border bg-emerald-950/80 text-emerald-200 border-emerald-500/50 flex items-center justify-between";

                console.log("Data Detail:", dataDetail);
                console.log("Data Summary:", dataSummary);
                console.log("Data Agreement:", dataAgreement);

            } catch (error) {
                console.error(error);
                document.getElementById('statusText').innerText = "Gagal memuat Google Sheets. Pastikan semua GID sudah dipublikasikan ke web sebagai CSV.";
                document.getElementById('statusMessage').className = "p-4 rounded-2xl text-sm font-semibold shadow-lg transition border bg-rose-950/80 text-rose-200 border-rose-500/50 flex items-center justify-between";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchAllGoogleSheets();
        });

        function switchTab(tabName) {
            document.getElementById('viewKomitmen').classList.add('hidden');
            document.getElementById('viewThreshold').classList.add('hidden');
            document.getElementById('viewPembayaran').classList.add('hidden');
            
            if(tabName === 'komitmen') document.getElementById('viewKomitmen').classList.remove('hidden');
            if(tabName === 'threshold') document.getElementById('viewThreshold').classList.remove('hidden');
            if(tabName === 'pembayaran') document.getElementById('viewPembayaran').classList.remove('hidden');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
