<html lang="id" class="dark"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dashboard EWS Monitoring Komitmen Cabang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .table-scroll-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-300 relative" id="bodyRoot">

    <header class="bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 fixed top-0 left-0 w-full z-50 shadow-xl px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-base font-extrabold text-white">Dashboard EWS Monitoring (Google Sheets Live Sync)</h1>
            <span id="syncStatus" class="text-xs bg-blue-900/60 text-blue-200 px-3 py-1 rounded-full border border-blue-400/30">Menyinkronkan...</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 pt-24 pb-10 space-y-6">
        <div id="statusMessage" class="p-4 rounded-2xl text-sm font-semibold border bg-blue-950/80 text-blue-200 border-blue-500/50">
            Sedang mengambil data live dari 3 Google Sheets...
        </div>

        <div class="glass-card rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-extrabold text-white uppercase tracking-wider mb-4">Data Sinkronisasi Otomatis</h2>
            <div id="tableContainer" class="table-scroll-wrapper text-xs text-slate-300">
                <p class="italic text-slate-500">Memuat data...</p>
            </div>
        </div>
    </main>

    <script>
        const URL_SHEET_DETAIL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=19393818&single=true&output=csv';
        const URL_SHEET_SUMMARY = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=1399865567&single=true&output=csv';
        const URL_SHEET_AGREEMENT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQMS9lJbhmYTRFWYg7JbIuPb_5huaq_7wORGGO9jOMJTT4eW7uUB_DC38R5E28UJg/pub?gid=1413662010&single=true&output=csv';

        async function loadAllSheets() {
            try {
                const [resD, resS, resA] = await Promise.all([
                    fetch(URL_SHEET_DETAIL),
                    fetch(URL_SHEET_SUMMARY),
                    fetch(URL_SHEET_AGREEMENT)
                ]);

                if(!resD.ok || !resS.ok || !resA.ok) throw new Error('Gagal mengambil data dari Google Sheets');

                const csvD = await resD.text();
                const csvS = await resS.text();
                const csvA = await resA.text();

                // Parsing CSV pakai SheetJS
                const jsonD = XLSX.utils.sheet_to_json(XLSX.read(csvD, {type:'string'}).Sheets[XLSX.read(csvD, {type:'string'}).SheetNames[0]], {header:1});
                const jsonS = XLSX.utils.sheet_to_json(XLSX.read(csvS, {type:'string'}).Sheets[XLSX.read(csvS, {type:'string'}).SheetNames[0]], {header:1});
                const jsonA = XLSX.utils.sheet_to_json(XLSX.read(csvA, {type:'string'}).Sheets[XLSX.read(csvA, {type:'string'}).SheetNames[0]], {header:1});

                document.getElementById('syncStatus').innerText = 'Sinkronisasi Berhasil';
                document.getElementById('syncStatus').className = 'text-xs bg-emerald-900/60 text-emerald-200 px-3 py-1 rounded-full border border-emerald-400/30';
                document.getElementById('statusMessage').innerText = 'Data berhasil ditarik langsung secara live dari 3 Sheet Google Sheets!';
                document.getElementById('statusMessage').className = 'p-4 rounded-2xl text-sm font-semibold border bg-emerald-950/80 text-emerald-200 border-emerald-500/50';

                // Tampilkan preview data summary di tabel web
                let html = '<p class="font-bold text-emerald-400 mb-2">Preview Data Summary:</p><table class="w-full border-collapse border border-slate-700"><tbody>';
                jsonS.slice(0, 15).forEach((row, rIdx) => {
                    html += '<tr class="border-b border-slate-800">';
                    row.forEach(cell => {
                        const tag = rIdx === 0 ? 'th' : 'td';
                        html += `<${tag} class="p-2 border border-slate-800">${cell !== undefined ? cell : ''}</${tag}>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                document.getElementById('tableContainer').innerHTML = html;

            } catch (err) {
                console.error(err);
                document.getElementById('syncStatus').innerText = 'Gagal Sinkron';
                document.getElementById('syncStatus').className = 'text-xs bg-rose-900/60 text-rose-200 px-3 py-1 rounded-full border border-rose-400/30';
                document.getElementById('statusMessage').innerText = 'Gagal memuat Google Sheets. Pastikan spreadsheet sudah di-publish ke web sebagai CSV pada masing-masing GID.';
                document.getElementById('statusMessage').className = 'p-4 rounded-2xl text-sm font-semibold border bg-rose-950/80 text-rose-200 border-rose-500/50';
            }
        }

        window.addEventListener('DOMContentLoaded', loadAllSheets);
    </script>
</body>
</html>
